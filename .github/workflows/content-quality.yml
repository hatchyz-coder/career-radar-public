name: Content quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build affiliate funnel surfaces for validation
        run: python scripts/enhance_affiliate_funnel.py
      - name: Validate affiliate monetization funnel
        run: python scripts/check_affiliate_funnel.py
      - name: Validate evergreen article depth
        run: python scripts/check_content_quality.py
      - name: Validate LLM site guide
        run: python scripts/check_llms_file.py
      - name: Validate editorial release queue
        run: python scripts/check_editorial_cadence.py
