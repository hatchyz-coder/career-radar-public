name: Editorial recovery publisher

on:
  push:
    branches:
      - main
    paths:
      - "scripts/recover_editorial_queue.py"
      - "scripts/polish_generated_articles.py"
      - "scripts/expand_generated_articles.py"
      - "scripts/build_bootstrap_search_hubs.py"
      - "scripts/generate_social_pack.py"
      - "scripts/check_content_quality.py"
      - "scripts/check_editorial_cadence.py"
      - "scripts/inject_analytics.py"
      - "assets/analytics.js"
      - ".github/workflows/editorial-recovery.yml"
      - "data/editorial_cadence.json"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: editorial-recovery-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate all due JP/EN releases and replenish runway
        run: python scripts/recover_editorial_queue.py
      - name: Apply semantic polish to generated articles
        run: python scripts/polish_generated_articles.py
      - name: Expand section-specific depth
        run: python scripts/expand_generated_articles.py
      - name: Build bootstrap search hubs and internal link graph
        run: python scripts/build_bootstrap_search_hubs.py
      - name: Inject CareerRadar analytics into all HTML
        run: python scripts/inject_analytics.py
      - name: Generate LinkedIn Facebook and X distribution copy
        run: python scripts/generate_social_pack.py
      - name: Validate content quality and duplication
        run: python scripts/check_content_quality.py
      - name: Validate editorial health after recovery
        run: python scripts/check_editorial_cadence.py
      - name: Commit generated publication artifacts
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No due editorial changes."
            exit 0
          fi
          git config user.name "career-radar-editorial-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial_cadence.json data/social index.html sitemap.xml ja/articles ja/topics en/articles articles assets *.html
          git commit -m "Auto-publish and prepare CareerRadar distribution pack"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Failed to publish editorial artifacts after 3 race-safe retries."
          exit 1
